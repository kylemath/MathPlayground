<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathPlayground</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --sidebar: #10141c;
      --line: rgba(255, 255, 255, 0.08);
      --text: #eef2f6;
      --muted: #8b97a8;
      --accent: #7eb6ff;
      --accent-dim: rgba(126, 182, 255, 0.16);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100%;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      padding: 1.6rem 1.15rem 1.25rem;
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(126, 182, 255, 0.14), transparent 55%),
        var(--sidebar);
      border-right: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .brand p {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .picker {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .picker button {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.15rem 0.75rem;
      width: 100%;
      margin: 0;
      padding: 0.85rem 0.9rem;
      text-align: left;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
      font: inherit;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .picker button:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(126, 182, 255, 0.35);
    }

    .picker button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .picker button[aria-current="true"] {
      background: var(--accent-dim);
      border-color: rgba(126, 182, 255, 0.7);
      box-shadow: inset 3px 0 0 var(--accent), var(--shadow);
    }

    .picker .index {
      grid-row: 1 / span 2;
      align-self: center;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
    }

    .picker .name {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .picker .blurb {
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.35;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      background: #000;
    }

    .stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0d1117;
    }

    @media (max-width: 820px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(70vh, 1fr);
      }

      .sidebar {
        gap: 1rem;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .picker {
        display: grid;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <h1>MathPlayground</h1>
      <p>Playground for math webapps and tests.</p>
    </div>
    <nav class="picker" aria-label="Pages">
      <button type="button" data-page="prime-lattice" aria-current="true">
        <span class="index">01</span>
        <span class="name">Prime Lattice</span>
        <span class="blurb">Primes on a cubic lattice</span>
      </button>
      <button type="button" data-page="ulam-spiral">
        <span class="index">02</span>
        <span class="name">Ulam Spiral</span>
        <span class="blurb">Fly a 3D spiral and compare sets</span>
      </button>
      <button type="button" data-page="magic-moments">
        <span class="index">03</span>
        <span class="name">Magic Moments</span>
        <span class="blurb">Energy of order-4 magic squares</span>
      </button>
    </nav>
  </aside>

  <main class="stage">
    <iframe id="view" title="Prime Lattice Explorer" src="PrimeLattice/index.html"></iframe>
  </main>

  <script>
    const pages = {
      "prime-lattice": {
        title: "Prime Lattice Explorer",
        src: "PrimeLattice/index.html",
      },
      "ulam-spiral": {
        title: "3D Ulam Spiral",
        src: "primeSpiral/index.html",
      },
      "magic-moments": {
        title: "Magic Moment Explorer",
        src: "MagicSK/MagicMomentExplorer/index.html",
      },
    };

    const frame = document.getElementById("view");
    const buttons = [...document.querySelectorAll(".picker button")];

    function show(id, push) {
      const page = pages[id] || pages["prime-lattice"];
      const key = pages[id] ? id : "prime-lattice";
      if (frame.getAttribute("src") !== page.src) {
        frame.src = page.src;
      }
      frame.title = page.title;
      buttons.forEach((button) => {
        if (button.dataset.page === key) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      });
      if (push) {
        history.replaceState(null, "", "#" + key);
      }
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => show(button.dataset.page, true));
    });

    window.addEventListener("hashchange", () => {
      show(location.hash.replace("#", ""), false);
    });

    const initial = location.hash.replace("#", "");
    if (pages[initial]) show(initial, false);
  </script>
</body>
</html>
